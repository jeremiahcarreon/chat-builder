name: chat-builder

x-app: &app
  build: .
  image: chat-builder:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://chatbuilder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/chatbuilder
    OLLAMA_URL: http://ollama:11434
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        # The api container runs the database migrations on start.
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: chatbuilder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chatbuilder
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to reach the database from your machine (e.g. with DBeaver).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbuilder -d chatbuilder"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ollama:
