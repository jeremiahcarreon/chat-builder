[project]
name = "chat-builder"
version = "0.1.0"
description = "Self-hosted builder for scoped, RAG-enabled chat apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "procrastinate>=2.0",
    "email-validator>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pgserver>=0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
