[project]
name = "chat-builder"
version = "0.1.0"
description = "Self-hosted builder for scoped, RAG-enabled chat apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "procrastinate>=2.0",
    "email-validator>=2.2",
    "anthropic>=1.11.0",
    "openai>=3.24.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "pymysql>=1.2.3",
    "pymssql>=2.4.2",
    "sqlglot>=30.21.0",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "pypdfium2>=5.14.0",
    "opencv-python-headless>=5.0.0.93",
    "typesafe-sdk>=0.7.2",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pgserver>=0.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
# RapidOCR depends on the desktop OpenCV build, which needs X11/OpenGL libraries the
# slim container doesn't have. The headless build provides the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
